<svg width='320' height='120' viewBox='0 0 320 120' fill='none' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <radialGradient id='vignette' cx='75%' cy='50%' r='45%'>
      <stop offset='0%' stop-color='#DBEAFE' stop-opacity='0.9'/>
      <stop offset='100%' stop-color='#EFF6FF' stop-opacity='0'/>
    </radialGradient>
  </defs>

  <!-- Left: 2D Chair Sketch -->
  <g transform='translate(15, 10)'>
    <!-- Backrest -->
    <path d='M25 15 C25 8, 55 8, 55 15 L53 58 C53 60, 27 60, 27 58 Z' stroke='#475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>
    <path d='M33 22 L33 55' stroke='#94A3B8' stroke-width='1.2' stroke-linecap='round'/>
    <path d='M47 22 L47 55' stroke='#94A3B8' stroke-width='1.2' stroke-linecap='round'/>
    <!-- Seat -->
    <path d='M20 58 L60 58 L68 68 L12 68 Z' stroke='#334155' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>
    <!-- Legs -->
    <line x1='16' y1='68' x2='14' y2='100' stroke='#334155' stroke-width='2' stroke-linecap='round'/>
    <line x1='64' y1='68' x2='66' y2='100' stroke='#334155' stroke-width='2' stroke-linecap='round'/>
    <line x1='27' y1='68' x2='28' y2='92' stroke='#64748B' stroke-width='1.5' stroke-linecap='round'/>
    <line x1='53' y1='68' x2='52' y2='92' stroke='#64748B' stroke-width='1.5' stroke-linecap='round'/>
  </g>

  <!-- Center Arrow -->
  <g transform='translate(130, 52)'>
    <line x1='0' y1='8' x2='32' y2='8' stroke='#64748B' stroke-width='2' stroke-linecap='round'/>
    <polyline points='24,2 32,8 24,14' fill='none' stroke='#64748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>
  </g>

  <!-- Right: 3D Rendered Chair Vignette & Model -->
  <g transform='translate(190, 5)'>
    <!-- Circular vignette background -->
    <ellipse cx='60' cy='55' rx='58' ry='50' fill='url(#vignette)'/>
    
    <!-- Soft floor shadow -->
    <ellipse cx='60' cy='102' rx='36' ry='7' fill='#94A3B8' fill-opacity='0.35'/>

    <!-- 3D Backrest cushion (smooth white/light-grey shaded) -->
    <path d='M38 18 C38 10, 82 10, 82 18 L80 60 C80 64, 40 64, 40 60 Z' fill='#E2E8F0'/>
    <path d='M41 19 C41 13, 79 13, 79 19 L77 58 C77 61, 43 61, 43 58 Z' fill='#F8FAFC'/>
    <!-- Backrest side bevel -->
    <path d='M80 18 L83 20 L81 60 L78 58 Z' fill='#CBD5E1'/>

    <!-- 3D Seat Cushion -->
    <path d='M33 60 C33 58, 87 58, 87 60 L93 72 C93 75, 27 75, 27 72 Z' fill='#E2E8F0'/>
    <path d='M34 61 C34 59, 86 59, 86 61 L91 71 C91 73, 29 73, 29 71 Z' fill='#FFFFFF'/>
    <path d='M27 72 L93 72 L91 77 L29 77 Z' fill='#94A3B8'/>

    <!-- 3D Solid Metallic/Wooden Legs -->
    <line x1='33' y1='77' x2='29' y2='102' stroke='#334155' stroke-width='3.5' stroke-linecap='round'/>
    <line x1='87' y1='77' x2='91' y2='102' stroke='#334155' stroke-width='3.5' stroke-linecap='round'/>
    <line x1='45' y1='75' x2='46' y2='96' stroke='#64748B' stroke-width='2.8' stroke-linecap='round'/>
    <line x1='75' y1='75' x2='74' y2='96' stroke='#64748B' stroke-width='2.8' stroke-linecap='round'/>
  </g>
</svg>